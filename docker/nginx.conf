server {
    listen 80;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # This line is the magic fix for 404 on refresh
        try_files $uri $uri/ /index.html;
    }

    # Optional: Handle static assets better
    location /static/ {
        root /usr/share/nginx/html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}